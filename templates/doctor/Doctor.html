<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
</head>
<body>

<form id="form2" name="form2" method="post" action="/myapp/doctor_doctor_post/" enctype="multipart/form-data">
    {% csrf_token %}
<table width="324" height="487" border="1">
  <tr>
    <td width="112">Name</td>
    <td width="196">
      <input type="text" name="textfield" id="textfield" required />
    </td>
  </tr>
  <tr>
    <td height="27">Email</td>
    <td><input type="email" name="textfield2" id="textfield2" required/></td>
  </tr>
  <tr>
    <td>Phone</td>
    <td><input type="text" name="textfield3" id="textfield3" required pattern="[0-9]{10}"/></td>
  </tr>
  <tr>
    <td height="41">Photo</td>
    <td><label for="fileField"></label>
      <input type="file" name="fileField" id="fileField" required/></td>
  </tr>
  <tr>
    <td height="59">Qualification</td>
    <td><select name="select" id="select">
      <option value="MBBS">MBBS</option>
      <option value="MD">MD</option>
      <option value="MS">MS</option>
      </select></td>
  </tr>
  <tr>
    <td>Department</td>
    <td>
      <select name="select2" id="select2">
          <option value="Cardiologists">Cardiologists</option>
          <option value="Neurologist">Neurologist</option>
          <option value="Pediatrics">Pediatrics </option>
          <option value="Emergency medicine">Emergency medicine </option>
          <option value="psychology">psychology </option>
      </select></td>
  </tr>
  <tr>
    <td>Gender</td>
    <td><table width="200">
        <tr>
          <td><label>
            <input type="radio" name="RadioGroup1" value="Male" id="RadioGroup1_0" required />
            Male</label></td>
        </tr>
        <tr>
          <td><label>
            <input type="radio" name="RadioGroup1" value="Female" id="RadioGroup1_1" required />
            Female</label></td>
        </tr>
      </table></td>
  </tr>
  <tr>
    <td>DOB</td>
    <td>
      <input type="date" name="textfield8" id="textfield8" required /></td>
  </tr>
  <tr>
    <td>Place</td>
    <td><input type="text" name="textfield4" id="textfield4" required /></td>
  </tr>
  <tr>
    <td>City</td>
    <td><input type="text" name="City" id="textfield5" required/></td>
  </tr>
  <tr>
    <td>State</td>
    <td><input type="text" name="textfield6" id="textfield6" required />
    </td>
  </tr>
  <tr>
    <td>Pincode</td>
    <td><input type="text" name="textfield7" id="textfield7" required pattern="[0-9]{6}"/></td>
  </tr>
    <tr>
    <td>password</td>
    <td><input type="text" name="textfield8" id="textfield7" required/></td>
  </tr>
    <tr>
    <td>confirmpassword</td>
    <td><input type="text" name="textfield9" id="textfield7" required/></td>
  </tr>
    <tr><td>
   <input type="submit" name="button" id="button" value="Submit" class="btn btn-success"/>
    </td>
    </tr>
</table>
</form>
</body>
</html>
