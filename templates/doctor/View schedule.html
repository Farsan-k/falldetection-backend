{% extends 'doctor/doctorindex.html' %}
{% block body %}

<body>
<form id="form1" name="form1" method="post" action="/myapp/doctor_viewschedule_post/">
{% csrf_token %}
    <table class="pull-left">
        <tr>
            <td width="219">From
                <input type="date" name="textfield" id="textfield" required/>
                <label for="textfield"></label>
            </td>
            <td width="198">To
                <input type="date" name="textfield2" id="textfield2" required/>
                <label for="textfield2"></label></td>
            <td><input type="submit" name="button" id="button" value="Search" class="btn btn-success" required/>
            </td>
        </tr>
    </table>
<table class="table table-bordered">
        <tr>
            <th width="74" height="72">S/no</th>
            <th width="76">Date</th>
            <th width="90">From time</th>
            <th width="82">To time</th>
            <td></td>
            <td></td>
        </tr>
        {% for i in data %}
            <tr>
                <td height="66">{{ forloop.counter }}</td>
                <td>{{ i.Date }} </td>
                <td>{{ i.Fromtime }}&nbsp;</td>
                <td>{{ i.Totime }}&nbsp;</td>
                <td><a href="/myapp/doctor_viewbooking/{{ i.id }}" class="btn btn-success">View Booking</a></td>
                <td><a href="/myapp/doctor_editschedule/{{ i.id }}" class="btn btn-success">Edit</a></td>
                <td><a href="/myapp/delete_schedule/{{ i.id }}" onclick="return confirm('Are you sure')" class="btn btn-danger">Delete</a></td>
            </tr>
        {% endfor %}
    </table>

</form>
</body>
{% endblock %}
