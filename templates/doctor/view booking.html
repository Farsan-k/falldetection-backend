{% extends 'doctor/doctorindex.html' %}
{% block body %}

<body>
<form id="form1" name="form1" method="post" action="/myapp/doctor_viewbooking_post/">
{% csrf_token %}
 <table class="pull-left">
        <tr>
            <td width="219">From
                <input type="date" name="textfield" id="textfield" required/>
                <label for="textfield"></label>
            </td>
            <td width="198">To
                <input type="date" name="textfield2" id="textfield2" required/>
                <label for="textfield2"></label></td>
            <td><input type="submit" name="button" id="button" value="Search" class="btn btn-success"/>
            </td>
        </tr>
    </table>
<table class="table table-bordered">
  <tr>
    <th width="49" height="147">S/no</th>
    <th width="50">Date</th>
    <th width="63">Status</th>
    <th width="84">Username</th>
  </tr>
    {% for i in data %}
  <tr>
    <td height="109">{{ forloop.counter }}&nbsp;</td>
    <td>{{ i.Date }}</td>
    <td>{{ i.Status  }}</td>
    <td>{{ i.USER.Name }}</td>
  </tr>
    {% endfor %}
</table>
</form>
</body>
{% endblock %}
