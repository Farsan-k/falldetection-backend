{% extends "admin/homeindex.html" %}
{% block body %}

<body>
      <form id="form1" name="form1" method="post" action="/myapp/admin_viewreview_post/">
      {% csrf_token %}
<table class="pull-left">
  <tr>
    <td width="216">From
      <input type="date" name="textfield" id="textfield" required />
        <label for="textfield"></label>
    </td>
    <td width="196">To
      <input type="date" name="textfield2" id="textfield2" required />
        <label for="textfield2"></label></td>
      <td><input type="submit" name="button" id="button" value="Search" class="btn btn-success" required  />
</td>
  </tr>
</table>
<table class="table table-bordered">
  <tr>
    <th width="40" height="111">S/no</th>
    <th width="45">Date</th>
    <th width="69">Review</th>
    <th width="86">Username</th>
  </tr>
        {% for i in data %}

  <tr>
    <td height="69">{{ forloop.counter }}&nbsp;</td>
    <td>&nbsp;{{ i.Date }}</td>
    <td>{{ i.Review }}&nbsp;</td>
    <td>{{ i.USER.Name }}</td>
  </tr>
    {% endfor %}
</table>
          </form>
</body>
{% endblock %}
