services:
  - type: web
    name: falldetection-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn falldetectionusingai.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: falldetection-db
          property: connectionString

databases:
  - name: falldetection-db
    databaseName: falldetection
    user: falldetection
    plan: free
