services:
  - type: web
    name: falldetection-web
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn falldetectionusingai.wsgi:application --log-file -
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
    # Optional free Postgres (uncomment if you decide to use it)
    # databases:
    #   - name: falldetection-db
    #     plan: free
    #     postgresVersion: 15

databases:
  - name: falldetection-db
    databaseName: falldetection
    user: falldetection
    plan: free